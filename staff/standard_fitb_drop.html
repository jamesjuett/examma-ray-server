<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <title>Examma Ray</title>
  <meta name="description" content="Exam development and grading server for examma-ray" />
  <meta name="author" content="James Juett" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- jquery and bootstrap -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" integrity="sha512-894YE6QWD5I59HgZOGReFYm4dnWc1Qt5NtvYSaNcOP+u1T9qYdvdihz0PPSiiqn/+/3e7Jo4EaG7TubfWGUrMQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://unpkg.com/@popperjs/core@2" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx" crossorigin="anonymous"></script>
        
  <!-- bootstrap icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!-- C is for Cookie -->
  <script src="https://cdn.jsdelivr.net/npm/js-cookie@2/src/js.cookie.min.js"></script>

  <!-- frontend -->
  <script src="js/standard_fitb_drop.js?v=32"></script>

</head>

<body style="overflow: hidden;">

  <div>
    <div style="margin: 5px 20px 5px 5px; height: 80px; position: sticky; top: 5px; display: flex; flex-direction: row; justify-content: space-between; align-items: stretch;">

      <div id="rubric-items">
        <!-- <button type="button" class="btn btn-sm btn-success" data-toggle="modal" data-target="#upload-sections-modal">Check Item</button> -->
      </div>
      <button type="button" class="btn btn-sm btn-success" id="create-rubric-item-open-modal">Add Rubric Item</button>

      <div style="float: right; vertical-align: middle; text-align: right;">
        <a class="btn btn-primary examma-ray-log-in-button" href="/auth/google" style="margin-bottom: 2px;">Sign In</a><br />
        <button style="display:none;" class="btn btn-warning examma-ray-log-out-button"><i class="bi bi-person-x-fill"></i> Sign Out</button>
      </div>
    
    
    </div>

    <table style="width: 100%;">
      <tr>
        <td>
          <div style="height: calc(100vh - 90px); width: 150px; overflow-y: scroll; border: 1px solid gray; padding: 0 0.5em;">
            <div style="position: sticky; top: 0; z-index: 100; background-color: white; padding: 0.5em 0;">
              <button id="check-matcher-button" type="button" class="btn btn-sm btn-success">Check</button>
              <button id="save-matcher-button" type="button" class="btn btn-sm btn-success">Save</button>
              <button type="button" class="btn btn-sm btn-success" id="create-evaluator-open-modal">Add Evaluator</button>
            </div>
            <div id="evaluator-items" style="margin-top: 1em;">
            </div>
          </div>
        </td>
        <td>
          <div id="grader-panel" style="height: calc(100vh - 90px); overflow-y: scroll; resize: horizontal; border: 1px solid gray; padding: 0.5em;">
            <div id="grader-question-response"></div>
            <div id="grader-fitb-drop-bank" class="examma-ray-fitb-grader-drop-bank"></div>
          </div>
        </td>
        <td>
          <div style="height: calc(100vh - 90px); overflow-y: scroll;">
            <div class="container-fluid">
              <div id="submission-cards" class="row row-cols-1 row-cols-md-2 row-cols-lg-4"></div>
              
            </div>
          </div>
        </td>
      </tr>
    </table>
    
  </div>

  <div class="modal fade" id="edit-rubric-item-modal" data-backdrop="static" data-keyboard="false" tabindex="-1" aria-labelledby="edit-rubric-item-modal-label" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="edit-rubric-item-modal-label">Edit Rubric Item</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <form id="edit-rubric-item-form">
            <div class="form-row">
              <div class="form-group col-12">
                <label for="edit-rubric-item-input-uuid">UUID</label>
                <input required type="text" disabled="disabled" class="form-control" id="edit-rubric-item-input-uuid">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group col-12">
                <label for="edit-rubric-item-input-title">Title</label>
                <input required type="text" class="form-control" id="edit-rubric-item-input-title" maxlength="100">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group col-3">
                <label for="edit-rubric-item-input-points">Points</label>
                <input required type="number" step="any" class="form-control" id="edit-rubric-item-input-points">
              </div>
              <div class="form-group col-3">
                <label for="edit-rubric-item-input-sort-index">Sort Index</label>
                <input required type="text" class="form-control" id="edit-rubric-item-input-sort-index" maxlength="10">
              </div>
              <div class="form-group col-6">
                <label for="edit-rubric-item-input-title">Policy</label>
                <input required type="text" class="form-control" pattern="first_match|best_score" placeholder="best_score OR first_match" id="edit-rubric-item-input-policy" maxlength="100">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group col-12">
                <label for="edit-rubric-item-input-description">Description</label>
                <textarea required class="form-control" id="edit-rubric-item-input-description" style="max-width: 100%;"></textarea>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          <button type="button" id="edit-rubric-item-submit-button" class="btn btn-primary">Create</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="edit-evaluator-modal" data-backdrop="static" data-keyboard="false" tabindex="-1" aria-labelledby="edit-evaluator-modal-label" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="edit-evaluator-modal-label">Edit Evaluator</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <form id="edit-evaluator-form">
            <div class="form-row">
              <div class="form-group col-12">
                <label for="edit-evaluator-input-uuid">UUID</label>
                <input required type="text" disabled="disabled" class="form-control" id="edit-evaluator-input-uuid">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group col-6">
                <label for="edit-evaluator-input-name">Name</label>
                <input required type="text" class="form-control" id="edit-evaluator-input-name" maxlength="100">
              </div>
              <div class="form-group col-3">
                <label for="edit-evaluator-input-points">Points</label>
                <input required type="number" step="any" class="form-control" id="edit-evaluator-input-points">
              </div>
              <div class="form-group col-3">
                <label for="edit-evaluator-input-sort-index">Sort Index</label>
                <input required type="text" class="form-control" id="edit-evaluator-input-sort-index" maxlength="10">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group col-12">
                <label for="edit-evaluator-input-explanation">Explanation</label>
                <textarea required class="form-control" id="edit-evaluator-input-explanation" style="max-width: 100%;"></textarea>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          <button type="button" id="edit-evaluator-submit-button" class="btn btn-primary">Create</button>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
