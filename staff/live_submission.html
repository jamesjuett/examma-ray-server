<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <title>Live Exam Submission Viewer</title>
  <meta name="author" content="James Juett" />

  <!-- TODO: Check This -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- jquery and bootstrap -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" integrity="sha512-894YE6QWD5I59HgZOGReFYm4dnWc1Qt5NtvYSaNcOP+u1T9qYdvdihz0PPSiiqn/+/3e7Jo4EaG7TubfWGUrMQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://unpkg.com/@popperjs/core@2" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx" crossorigin="anonymous"></script>
        
  <!-- bootstrap icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!-- C is for Cookie -->
  <script src="https://cdn.jsdelivr.net/npm/js-cookie@2/src/js.cookie.min.js"></script>

  <!-- frontend -->
  <script src="js/live_submission.js?v=35"></script>

</head>

<body style="margin-top: 75px;">
  

  <div style="margin: 5px 20px; position: fixed; top: 5px; right: 5px; border: solid 1px #ccc; border-radius: 5px; background-color: #f2f2f2; padding: 5px; z-index: 100;">
    <div style="text-align: center; margin-bottom: 5px;">
      <a class="btn btn-sm btn-primary examma-ray-log-in-button" href="/auth/google">Sign In</a>
      <button style="display:none;" class="btn btn-sm btn-warning examma-ray-log-out-button"><i class="bi bi-person-x-fill"></i> Sign Out</button>
    </div>
    <div style="text-align: center; margin-bottom: 5px;">
      <span id="exam-name-status" style="margin-left: 1em"></span>
    </div>
    <div style="text-align: center;">
      <input id="live-submission-viewer-uniqname-input" class="form-control" type="text" size="10" maxlength="10" style="display: inline-block; font-family: monospace; width: 10em;"
        autocomplete="off" autocorrect="off" spellcheck="false"
      >
      <button id="live-submission-viewer-view-button" class="btn btn-sm btn-primary">View</button>
    </div>


  </div>
    
  <div id="live-submission-container" style="margin: 20px;"></div>
  
</body>

</html>
