# docker-compose.yml

version: "3.7"
services:

  examma-ray-server:
    build:
      context: .
    command: "wait-for-it db:5432 -- bash -c \"npm install && npm install examma-ray@latest && npm run build && npm run migrate && node ./build/server.js\""
    # command: "wait-for-it db:5432 -- bash -c \"npm run build && npm run migrate && node ./build/server.js\""
    restart: always
    environment:
      DB_NAME: exammaray
      DB_USER: exammaray
      DB_HOST: db
      DB_PORT: 5432
      NODE_ENV: development
    secrets:
      - db_password
      - jwt_secret
      - participation_secret
      - google_client_secret
    depends_on:
      - db
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./src:/usr/src/app/src
      - ./data:/usr/src/app/data
      - ./out:/usr/src/app/out
      - ./staff:/usr/src/app/staff
      - ./live:/usr/src/app/live
      - ./uploads:/usr/src/app/uploads
      - ./public:/usr/src/app/public
    networks:
        - http
        - db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: exammaray
      POSTGRES_DB: exammaray
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports: 
      - '127.0.0.1:5432:5432'
    volumes:
      - examma-ray-db:/var/lib/postgresql/data
    networks:
      - db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2.4.6
    restart: always
    volumes:
      - ./Caddyfile-dev:/etc/caddy/Caddyfile
      - ./secrets/certs:/root/certs
    networks:
      - http
    ports:
      - "80:80"
      - "443:443"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        
volumes:
  examma-ray-db:

networks:
  http:
  db:

secrets:
  db_password:
      file: ./secrets/db_password
  jwt_secret:
      file: ./secrets/jwt_secret
  participation_secret:
      file: ./secrets/participation_secret
  google_client_secret:
      file: ./secrets/google_client_secret